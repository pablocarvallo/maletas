<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Maletas</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Maletas">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F4EDE2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1D1A17" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=1">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<style>
:root{
  --bg:#F4EDE2; --bg2:#E9DFCF; --card:#FFFCF7; --ink:#2A2521; --ink2:#7A6F64; --line:rgba(60,40,20,.12);
  --accent:#1F7A78; --accent-ink:#fff; --danger:#C8312B; --soft:rgba(31,122,120,.12);
  --shadow:0 8px 22px rgba(70,45,20,.16);
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#1D1A17; --bg2:#14110F; --card:#2A2521; --ink:#F3ECE2; --ink2:#A89C8F; --line:rgba(255,235,210,.12);
    --accent:#4CC2BC; --accent-ink:#0E2A29; --soft:rgba(76,194,188,.16); --shadow:0 8px 22px rgba(0,0,0,.45); }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{touch-action:pan-x pan-y;background:var(--bg)}
body{margin:0;min-height:100vh;color:var(--ink);background:linear-gradient(var(--bg),var(--bg2)) fixed;
  font:16px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;-webkit-font-smoothing:antialiased;
  overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
svg{display:block}
textarea,input[type=text]{-webkit-user-select:text;user-select:text}

#app{padding:calc(env(safe-area-inset-top) + 16px) 18px calc(env(safe-area-inset-bottom) + 190px);max-width:560px;margin:0 auto}
.top{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:6px}
.eyebrow{font-size:13px;font-weight:600;color:var(--ink2)}
h1{margin:0;font-size:34px;line-height:1.05;letter-spacing:-.03em;font-weight:800}
.round{width:42px;height:42px;border-radius:21px;background:var(--card);box-shadow:0 2px 8px rgba(70,45,20,.12);display:grid;place-items:center}
.round svg{width:22px;height:22px}
h2.sec{display:flex;align-items:baseline;gap:8px;margin:22px 2px 6px;font-size:15px;font-weight:700;color:var(--ink2)}
h2.sec small{font-weight:600;font-size:13px;opacity:.8}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px 8px;align-items:start;padding:4px 0 2px}
.cell{position:relative;text-align:center;border-radius:20px;padding:8px 2px 8px;transition:transform .16s,background .16s;cursor:pointer}
.cell .cs{position:relative}
.cell .cs svg{width:100%}
.cell.sm .cs svg{width:83.33%;margin:0 auto}
.cell .nm{display:block;font-weight:650;font-size:13.5px;margin-top:3px;line-height:1.15}
.cell .meta{display:block;font-size:12px;color:var(--ink2);margin-top:1px}
.cell .chip{display:inline-block;font-style:normal;font-size:11px;font-weight:600;color:var(--accent);background:var(--soft);padding:1px 8px;border-radius:10px;margin-top:3px}
.badge{position:absolute;top:0;right:4px;min-width:23px;height:23px;border-radius:12px;background:var(--accent);color:var(--accent-ink);
  font-size:12.5px;font-weight:800;display:grid;place-items:center;padding:0 6px;box-shadow:0 2px 6px rgba(0,0,0,.28)}
.cell.can{background:var(--soft)}
.cell.lift{opacity:.35}
.cell.hot{transform:scale(1.07);background:var(--soft);outline:2.5px solid var(--accent)}
.shelf-out.hot{outline:2.5px dashed var(--accent);border-radius:20px}
.hint{margin:16px 4px 0;font-size:13px;color:var(--ink2);text-align:center}

#dock{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:10px 14px calc(env(safe-area-inset-bottom) + 10px);
  background:var(--card);border-radius:28px 28px 0 0;box-shadow:0 -8px 26px rgba(60,40,20,.14)}
.dock-in{max-width:560px;margin:0 auto}
.dock-head{display:flex;align-items:center;justify-content:space-between;margin:2px 4px 8px}
.dock-head b{font-size:15px}
.dock-head small{color:var(--ink2);font-weight:600;margin-left:6px}
.pill{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 15px;border-radius:18px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:15px}
.pill svg{width:16px;height:16px}
.strip{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none;-webkit-overflow-scrolling:touch;min-height:100px}
.strip::-webkit-scrollbar{display:none}
.th{flex:0 0 auto;width:78px;height:96px;border-radius:18px;background:var(--bg);display:grid;place-items:center;padding:7px;touch-action:pan-x;position:relative}
.th svg{max-width:100%;max-height:100%;width:auto;height:100%}
.th.lift{opacity:.35}
.dock-empty{flex:1;border:2px dashed var(--line);border-radius:18px;display:grid;place-items:center;padding:0 16px;color:var(--ink2);font-size:13.5px;text-align:center;height:96px}

#ghost{position:fixed;left:0;top:0;z-index:200;pointer-events:none;filter:drop-shadow(0 14px 14px rgba(0,0,0,.35));will-change:transform}
#ghost svg{width:100%;height:100%}

#view{position:fixed;inset:0;z-index:40;background:linear-gradient(var(--bg),var(--bg2));display:none;flex-direction:column;padding-top:env(safe-area-inset-top)}
#view.on{display:flex}
#view.pop{animation:vpop .38s cubic-bezier(.2,.8,.2,1)}
@keyframes vpop{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
.vhead{display:flex;align-items:center;justify-content:space-between;padding:10px 12px 4px;gap:8px}
.vback{display:flex;align-items:center;gap:2px;color:var(--accent);font-weight:650;font-size:16px;height:40px;padding:0 8px 0 2px;max-width:46%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vback svg{width:22px;height:22px;flex:0 0 auto}
.vtitle{flex:1;text-align:center;font-weight:750;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vbody{flex:1;overflow-y:auto;padding:8px 18px 150px;-webkit-overflow-scrolling:touch}
.vsum{text-align:center;color:var(--ink2);font-size:13.5px;margin:14px 0 0}
.vbar{position:absolute;left:0;right:0;bottom:0;padding:26px 18px calc(env(safe-area-inset-bottom) + 14px);display:flex;gap:10px;justify-content:center;
  background:linear-gradient(transparent,var(--bg2) 45%)}
.vbar .pill{height:48px;border-radius:24px;padding:0 26px;font-size:16px}
#outbar{position:absolute;left:14px;right:14px;bottom:calc(env(safe-area-inset-bottom) + 14px);height:64px;border-radius:22px;border:2.5px dashed var(--accent);background:var(--card);
  color:var(--accent);font-weight:700;display:none;align-items:center;justify-content:center;gap:8px;z-index:5}
body.dragging #outbar.show{display:flex}
#outbar.hot{background:var(--accent);color:var(--accent-ink)}

/* maleta abierta */
.open-case{margin:0 auto;border-radius:30px;background:var(--shell);position:relative;padding:12px;box-shadow:var(--shadow)}
.open-case.dots{background-image:radial-gradient(circle,var(--dots) 27%,transparent 29%),radial-gradient(circle,var(--dots) 27%,transparent 29%);background-size:24px 24px;background-position:0 0,12px 12px}
.open-case.img,.open-case.img .lid .out{background-image:var(--img);background-size:cover;background-position:center;background-repeat:no-repeat}
.open-case.img.tile,.open-case.img.tile .lid .out{background-size:96px 96px;background-repeat:repeat}
.open-case.hot{outline:3px solid var(--accent);outline-offset:3px}
.lid-wrap{position:relative;z-index:3;perspective:1000px;height:132px;margin-bottom:6px}
.lid{position:absolute;inset:0;transform-origin:50% 100%;transform-style:preserve-3d}
.lid .face{position:absolute;inset:0;border-radius:20px 20px 8px 8px;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden}
.lid .in{background:var(--lining);box-shadow:inset 0 3px 10px rgba(0,0,0,.25)}
.lid .out{transform:rotateX(180deg);background:var(--shell);box-shadow:0 4px 12px rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.15)}
.open-case.dots .lid .out{background-image:radial-gradient(circle,var(--dots) 27%,transparent 29%),radial-gradient(circle,var(--dots) 27%,transparent 29%);background-size:24px 24px;background-position:0 0,12px 12px}
.opening .lid{animation:lid .85s cubic-bezier(.25,.8,.25,1) both}
@keyframes lid{from{transform:rotateX(-180deg)}to{transform:rotateX(0)}}
.pocket{position:absolute;left:8%;right:8%;top:20%;bottom:16%;border-radius:12px;border:1.5px solid rgba(0,0,0,.18);
  background:linear-gradient(rgba(0,0,0,.09) 1px,transparent 1px) 0 0/9px 9px,linear-gradient(90deg,rgba(0,0,0,.09) 1px,transparent 1px) 0 0/9px 9px,rgba(255,255,255,.4)}
.pocket::before{content:"";position:absolute;left:10px;right:10px;top:-7px;height:0;border-top:2.5px dashed rgba(0,0,0,.38)}
.strap{position:absolute;top:0;bottom:0;width:11px;background:var(--shell);opacity:.9}
.strap.a{left:3.5%}.strap.b{right:3.5%}
.strap::after{content:"";position:absolute;left:1px;right:1px;top:48%;height:14px;border-radius:3px;background:rgba(255,255,255,.55);border:1px solid rgba(0,0,0,.2)}
.tag{position:absolute;left:50%;top:6px;transform:translateX(-50%);background:var(--shell);color:var(--shell-ink);font-size:11.5px;font-weight:700;padding:2px 12px;border-radius:0 0 9px 9px;max-width:70%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.base{position:relative;border-radius:10px 10px 22px 22px;background:var(--lining);box-shadow:inset 0 10px 16px rgba(0,0,0,.2),inset 0 -2px 6px rgba(0,0,0,.12);overflow:hidden}
.base::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(135deg,rgba(0,0,0,.025) 0 6px,transparent 6px 12px);pointer-events:none}
.base .none{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:0 30px;color:rgba(0,0,0,.45);font-size:14px;font-weight:600}
.it{position:absolute;touch-action:pan-y;transition:transform .15s;filter:drop-shadow(0 var(--sy,3px) var(--sb,3px) rgba(0,0,0,.3))}
.it .art{position:absolute}
.it svg{width:100%;height:100%;display:block}
.base>.badge{position:absolute}
.base.tight{box-shadow:inset 0 12px 20px rgba(0,0,0,.32),inset 0 -3px 8px rgba(0,0,0,.2),inset 10px 0 14px rgba(0,0,0,.12),inset -10px 0 14px rgba(0,0,0,.12)}
.cstrap{position:absolute;left:0;right:0;height:15px;margin-top:-7px;background:linear-gradient(#4a4a52,#34343a);box-shadow:0 3px 5px rgba(0,0,0,.35);z-index:9000;pointer-events:none}
.cstrap i{position:absolute;left:50%;top:-3px;width:26px;height:21px;margin-left:-13px;border-radius:5px;background:linear-gradient(#f1f1f4,#c9c9d0);border:1px solid rgba(0,0,0,.4)}
.cstrap i::after{content:"";position:absolute;left:5px;right:5px;top:8px;height:5px;border-radius:2px;background:rgba(0,0,0,.35)}
.fill{margin:2px auto 12px;max-width:560px}
.fill .ftop{display:flex;justify-content:space-between;align-items:baseline;font-size:13.5px;color:var(--ink2)}
.fill .ftop b{font-size:20px;color:var(--ink);letter-spacing:-.01em}
.fill .fbar{height:10px;border-radius:5px;background:rgba(0,0,0,.09);overflow:hidden;margin-top:5px}
.fill .fbar i{display:block;height:100%;border-radius:5px;background:var(--accent);transition:width .5s}
.fill.hi .fbar i{background:#E0A526}
.fill.over .fbar i{background:var(--danger)}
.fill.over .ftop b{color:var(--danger)}
.fill small{display:block;margin-top:5px;font-size:12.5px;color:var(--ink2)}
.inv{max-width:560px;margin:18px auto 0}
.inv h3{font-size:14px;color:var(--ink2);margin:0 0 6px;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.inr{display:flex;align-items:center;gap:12px;padding:8px 10px;border-radius:14px;background:var(--card);margin-bottom:6px;touch-action:pan-y}
.inr .th2{width:54px;height:42px;flex:0 0 auto}
.inr .th2 svg{width:100%;height:100%}
.inr .tx{flex:1;min-width:0}
.inr .tx b{display:block;font-size:14.5px}
.inr .tx small{color:var(--ink2);font-size:12.5px}
.inr em{font-style:normal;font-weight:700;font-size:13.5px;color:var(--ink2)}
.it.lift{opacity:.3}
.it.sc .badge{top:-4px;right:-2px}
.opening .it{animation:drop .5s cubic-bezier(.2,.9,.3,1.2) both;animation-delay:calc(.55s + var(--d)*.06s)}
@keyframes drop{from{opacity:0;transform:translateY(-34px) rotate(var(--r)) scale(1.12)}to{opacity:1;transform:rotate(var(--r))}}
.it.hot{outline:3px solid var(--accent);outline-offset:2px;border-radius:12px}

/* hojas */
#scrim{position:fixed;inset:0;z-index:60;background:rgba(20,12,5,.42);opacity:0;pointer-events:none;transition:opacity .25s}
#scrim.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;max-height:92vh;display:flex;flex-direction:column;background:var(--card);
  border-radius:34px 34px 0 0;transform:translateY(106%);transition:transform .34s cubic-bezier(.2,.8,.2,1);padding-bottom:env(safe-area-inset-bottom);
  max-width:560px;margin:0 auto}
#sheet.on{transform:none}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:9px auto 2px;flex:0 0 auto}
.sh-head{display:flex;align-items:center;justify-content:space-between;padding:6px 18px 8px;flex:0 0 auto}
.sh-head h3{margin:0;font-size:17px;font-weight:750}
.sh-head .lnk{color:var(--accent);font-weight:650;min-width:70px}
.sh-head .lnk:last-child{text-align:right}
.sh-body{overflow-y:auto;padding:4px 18px 14px;-webkit-overflow-scrolling:touch;flex:1 1 auto}
.sh-foot{padding:8px 18px 14px;flex:0 0 auto}
.btn{display:flex;align-items:center;justify-content:center;width:100%;height:52px;border-radius:26px;font-weight:750;font-size:17px;background:var(--bg);color:var(--ink)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--danger)}
.btn+.btn{margin-top:10px}
.stage{height:172px;border-radius:24px;background:var(--bg);display:grid;place-items:center;padding:12px;margin-bottom:8px}
.stage svg{height:100%;width:auto;max-width:100%}
.cap{text-align:center;font-weight:700;margin:2px 0 12px}
.lab{font-size:13px;font-weight:700;color:var(--ink2);margin:14px 2px 7px}
.seg{display:flex;background:var(--bg);border-radius:14px;padding:3px;gap:2px}
.seg button{flex:1;height:36px;border-radius:11px;font-size:14px;font-weight:650;color:var(--ink2);padding:0 4px;line-height:1.1}
.seg.five button{font-size:12.5px;padding:0 1px;letter-spacing:-.01em}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 5px rgba(60,40,20,.2)}
.sws{display:flex;flex-wrap:wrap;gap:9px}
.sw{width:36px;height:36px;border-radius:18px;border:2px solid var(--line);position:relative;display:block;flex:0 0 auto}
.sw.on{outline:3px solid var(--accent);outline-offset:2px}
.sw.cust{background:conic-gradient(#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00);overflow:hidden}
.sw.cust input{position:absolute;inset:-6px;width:60px;height:60px;opacity:0;cursor:pointer}
.trow{display:flex;align-items:center;justify-content:space-between;margin-top:16px;padding:0 2px}
.trow b{font-size:15px}
.switch{width:51px;height:31px;border-radius:16px;background:var(--line);position:relative;transition:background .2s}
.switch::after{content:"";position:absolute;left:2px;top:2px;width:27px;height:27px;border-radius:14px;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.3);transition:transform .2s}
.switch.on{background:var(--accent)}
.switch.on::after{transform:translateX(20px)}
.field{width:100%;height:48px;border-radius:14px;border:0;background:var(--bg);color:var(--ink);font:inherit;font-size:17px;padding:0 14px;outline:none}
.list{background:var(--bg);border-radius:18px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;width:100%;min-height:52px;padding:8px 14px;text-align:left;font-size:16px;font-weight:600}
.row+.row{border-top:1px solid var(--line)}
.row .sub{margin-left:auto;color:var(--ink2);font-size:13.5px;font-weight:500;white-space:nowrap}
.row.danger{color:var(--danger)}
.row svg.ic{width:22px;height:22px;flex:0 0 auto;color:var(--accent)}
.row.danger svg.ic{color:var(--danger)}
.row .mini{width:30px;height:38px;flex:0 0 auto}
.row .mini svg{width:100%;height:100%}
.pv{display:flex;gap:14px;align-items:center;margin-bottom:12px}
.pv .box{width:96px;height:110px;border-radius:20px;background:var(--bg);display:grid;place-items:center;padding:8px;flex:0 0 auto}
.pv .box svg{max-width:100%;max-height:100%;width:auto;height:100%}
.pv h4{margin:0;font-size:18px;font-weight:750}
.pv p{margin:2px 0 0;color:var(--ink2);font-size:14px}
.pickgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pick{position:relative;border-radius:18px;background:var(--bg);height:104px;display:grid;place-items:center;padding:8px}
.pick svg{max-width:100%;max-height:100%;width:auto;height:100%}
.pick.on{outline:3px solid var(--accent);outline-offset:-1px}
.pick .ck{position:absolute;top:6px;right:6px;width:22px;height:22px;border-radius:11px;background:var(--accent);color:var(--accent-ink);display:none;place-items:center;font-size:13px;font-weight:800}
.pick.on .ck{display:grid}
textarea.bk{width:100%;height:150px;border-radius:14px;border:0;background:var(--bg);color:var(--ink);padding:12px;font:12px/1.35 ui-monospace,Menlo,monospace;resize:none;outline:none}
.photo-btn{position:relative;display:flex;align-items:center;gap:9px;margin-top:12px;height:46px;padding:0 14px;border-radius:14px;background:var(--bg);color:var(--accent);font-weight:700;font-size:15px;overflow:hidden}
.photo-btn svg{width:21px;height:21px;flex:0 0 auto}
.photo-btn input{position:absolute;inset:0;width:100%;height:100%;opacity:0;font-size:0;cursor:pointer}
.phwrap{position:relative;display:block;margin:0 auto;border-radius:18px;overflow:hidden;background:#000;line-height:0}
.phwrap canvas{display:block;touch-action:none}
.phmark{position:absolute;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1.5px rgba(0,0,0,.55),0 2px 8px rgba(0,0,0,.5);pointer-events:none;display:none}
.prframe{position:absolute;border:2.5px solid #fff;border-radius:6px;box-shadow:0 0 0 2000px rgba(0,0,0,.5);pointer-events:none}
.rng{width:100%;height:34px;accent-color:var(--accent)}
.phsel{display:flex;align-items:center;gap:14px;margin-top:14px;padding:10px 14px;border-radius:18px;background:var(--bg)}
.phsel .big{width:48px;height:48px;border-radius:24px;border:2px solid var(--line);flex:0 0 auto}
.phsel b{font-size:17px;letter-spacing:.02em}
.phsel small{display:block;color:var(--ink2);font-size:13px;font-weight:600}
.phsel .mini{margin-left:auto;width:44px;height:64px;flex:0 0 auto}
.phsel .mini.wide{width:96px;height:68px}
.phsel .mini svg{width:100%;height:100%}
.note{font-size:13px;color:var(--ink2);margin:8px 2px}

#toast{position:fixed;left:50%;width:max-content;bottom:calc(env(safe-area-inset-bottom) + 176px);transform:translate(-50%,16px);opacity:0;pointer-events:none;z-index:90;
  background:rgba(30,24,20,.94);color:#fff;border-radius:22px;padding:10px 16px;display:flex;align-items:center;gap:14px;font-size:14.5px;font-weight:600;
  transition:opacity .25s,transform .25s;max-width:92vw;box-shadow:0 8px 24px rgba(0,0,0,.35)}
#toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast button{color:#7FE3DC;font-weight:750}
body.inview #toast{bottom:calc(env(safe-area-inset-bottom) + 90px)}
@media (prefers-reduced-motion: reduce){ .opening .lid,.opening .it,#view.pop{animation:none} #sheet{transition:none} }
</style>
</head>
<body>
<div id="app"></div>
<div id="dock"><div class="dock-in" id="dockin"></div></div>
<div id="view"></div>
<div id="scrim" data-act="close"></div>
<div id="sheet"></div>
<div id="toast"><span id="toastmsg"></span><button data-act="undo" id="undo">Deshacer</button></div>
<div id="ghost" style="display:none"></div>

<script>
(function () {
'use strict';
var KEY = 'maletas.v1';

    case 'pick': { var key = k + ':' + v; if (PICK.sel[key]) delete PICK.sel[key]; else PICK.sel[key] = true; b.classList.toggle('on', !!PICK.sel[key]); break; }
    case 'pick-ok': {
      var keys = Object.keys(PICK.sel); if (!keys.length) { closeSheet(); break; }
      var dest = PICK.cid;
      mutate(function () { keys.forEach(function (s) { var p = parseSpec(s); if (p[0] === 'item') { var x = itemById(p[1]); if (x) x.place = dest; } else { var y = caseById(p[1]); if (y) y.parent = dest; } }); }, keys.length + (keys.length === 1 ? ' cosa guardada' : ' cosas guardadas'));
      closeSheet(); break;
    }
    case 'backup': openBackup(); break;
    case 'bk-copy': {
      var ta = $('#bktext'); ta.focus(); ta.select(); ta.setSelectionRange(0, ta.value.length);
      var done = function () { toast('Respaldo copiado'); };
      try { if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(ta.value).then(done, function () { document.execCommand('copy'); done(); }); } else { document.execCommand('copy'); done(); } } catch (err) { toast('Selecciona el texto y cópialo'); }
      break;
    }
    case 'bk-restore': {
      var d; try { d = sane(JSON.parse($('#bktext').value)); } catch (err) { d = null; }
      if (!d) { toast('El texto no es un respaldo válido'); break; }
      S = d; save(); V.stack = []; closeSheet(); render(); renderView(false); toast('Respaldo restaurado'); break;
    }
  }
});
